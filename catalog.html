<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Equipos - VERI2309</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .header-links {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-links a {
            color: #00d9ff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .header-links a:hover {
            color: #00ff88;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 16px;
            color: #00d9ff;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #00d9ff;
        }

        .input-group input::placeholder {
            color: #666;
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d9ff, #00ff88);
            color: #000;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            flex: 1;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .equipment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .equipment-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 217, 255, 0.2);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .equipment-card:hover {
            border-color: #00d9ff;
            box-shadow: 0 5px 20px rgba(0, 217, 255, 0.2);
            transform: translateY(-3px);
        }

        .equipment-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .equipment-badge {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .equipment-badge.unverified {
            background: rgba(255, 200, 0, 0.2);
            color: #ffc800;
        }

        .equipment-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .equipment-id {
            color: #aaa;
            font-size: 0.8rem;
        }

        .equipment-model {
            color: #00d9ff;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .equipment-brand {
            color: #888;
            font-size: 0.9rem;
        }

        .equipment-type {
            background: rgba(0, 217, 255, 0.1);
            padding: 8px;
            border-radius: 6px;
            color: #00d9ff;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .equipment-description {
            color: #aaa;
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .equipment-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.85rem;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 4px;
        }

        .stat-label {
            color: #888;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .stat-value {
            color: #00ff88;
            font-weight: 600;
            margin-top: 2px;
        }

        .equipment-footer {
            color: #888;
            font-size: 0.8rem;
            text-align: center;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
            grid-column: 1 / -1;
        }

        .empty-state-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal {
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #00d9ff;
            margin: 0;
        }

        .modal-close {
            background: none;
            border: none;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin: 16px 0;
        }

        .spec-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #00d9ff;
        }

        .spec-label {
            color: #aaa;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .spec-value {
            color: #00d9ff;
            font-weight: 600;
            margin-top: 6px;
        }

        .section-title {
            color: #00ff88;
            font-size: 1.1rem;
            font-weight: 600;
            margin: 16px 0 12px 0;
        }

        .procedure-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px;
            border-radius: 8px;
            margin: 8px 0;
        }

        .procedure-title {
            color: #00ff88;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: capitalize;
        }

        .procedure-text {
            color: #ccc;
            line-height: 1.6;
            font-size: 0.9rem;
        }

        .applications {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0;
        }

        .app-tag {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .images-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin: 12px 0;
        }

        .gallery-image {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid rgba(0, 217, 255, 0.3);
            transition: all 0.3s;
        }

        .gallery-image:hover {
            border-color: #00d9ff;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }

            .equipment-grid {
                grid-template-columns: 1fr;
            }

            .filters-grid {
                grid-template-columns: 1fr;
            }

            .btn-row {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <h1>📚 Catálogo de Equipos</h1>
        <p class="subtitle">Información técnica, funcionamiento y parámetros de equipos de laboratorio</p>

        <div class="header-links">
            <a href="index.html">← Volver a VERI2309</a>
        </div>

        <!-- Panel de Filtros -->
        <div class="card">
            <h2>🔍 Filtrar y Buscar</h2>

            <div class="filters-grid">
                <div class="input-group">
                    <label>🔎 Búsqueda Rápida</label>
                    <input type="text" id="catalogSearchInput" placeholder="Buscar por serie, modelo, marca...">
                </div>

                <div class="input-group">
                    <label>🏷️ Marca</label>
                    <select id="catalogFilterMarca">
                        <option value="">-- Todas las marcas --</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>⚙️ Tipo</label>
                    <select id="catalogFilterTipo">
                        <option value="">-- Todos los tipos --</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>✅ Estado</label>
                    <select id="catalogFilterEstado">
                        <option value="">-- Todos --</option>
                        <option value="verificado">✅ Verificado</option>
                        <option value="no-verificado">⚠️ No verificado</option>
                    </select>
                </div>
            </div>

            <div class="btn-row">
                <button id="catalogResetFiltersBtn" class="btn btn-secondary">🔄 Limpiar Filtros</button>
                <button id="catalogApplyFiltersBtn" class="btn btn-primary">🔍 Aplicar Filtros</button>
            </div>
        </div>

        <!-- Grid de Equipos -->
        <div id="catalogGrid" class="equipment-grid"></div>

        <!-- Mensaje sin resultados -->
        <div id="catalogNoResults" class="empty-state" style="display: none;">
            <div class="empty-state-icon">📭</div>
            <div>No se encontraron equipos con los filtros seleccionados</div>
        </div>
    </div>

    <script src="catalog-standalone.js"></script>
</body>

</html>
